    <script>
      const button = document.getElementById('voidbtn');
        const body = document.body;

        button.addEventListener('click', () => {
            if (body.classList.contains('default-cursor')) {
                body.classList.remove('default-cursor');
                body.classList.add('voidMouse');
            } else {
                body.classList.remove('voidMouse');
                body.classList.add('default-cursor');
            }
        });
